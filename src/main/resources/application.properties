server.port=8080
spring.application.name=chodocu-backend

# ===================================================================
# CẤU HÌNH SUPABASE DATABASE (POSTGRESQL)
# Project URL: https://ovxnlepmewindufcgxln.supabase.co
# Publishable Key: sb_publishable_K8ULW9tqBfNFhtRg8l1QjA_v3turNaH
# Direct URI: postgresql://postgres:@Duchuy2910@db.ovxnlepmewindufcgxln.supabase.co:5432/postgres
# Sử dụng Supabase Session Pooler (IPv4/IPv6 tương thích mọi mạng sinh viên)
# ===================================================================
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SUPABASE_DB_USER:postgres.ovxnlepmewindufcgxln}
spring.datasource.password=${SUPABASE_DB_PASSWORD:@Duchuy2910}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình HikariCP tối ưu cho Supabase Pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase API Config
app.supabase.url=https://ovxnlepmewindufcgxln.supabase.co
app.supabase.key=sb_publishable_K8ULW9tqBfNFhtRg8l1QjA_v3turNaH
# Service role key: BẮT BUỘC để upload ảnh lên Supabase Storage.
# Lấy tại Supabase Dashboard > Project Settings > API > service_role (secret).
# Nên đặt qua biến môi trường thay vì commit vào repo.
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:passuni}

# JWT Security Configuration (đặt app.jwt.secret qua biến môi trường khi deploy)
app.jwt.secret=${JWT_SECRET:PassUniStudentFleaMarketSecretKeyForJwtAuthentication2026ChodocuSpringSecurity}
app.jwt.expiration-ms=604800000

# Upload Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
